<!DOCTYPE html>
<html>
<head>
	<!-- This title is used for tabs and bookmarks -->
	<title>System Directory - Socials</title>
	<!-- Use UTF character set, a good idea with any webpage -->
  	<meta charset="UTF-8" />
	<!-- Set viewport so page remains consistently scaled w narrow devices -->
  	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
	<!-- Include a sitewide CSS file for consistent styling across the site -->
	<link rel="stylesheet" type="text/css" href="../css/site.css">
	<!-- Lab-specifc CSS file for any special styling of this particular page -->
	<link rel="stylesheet" type="text/css" href="css/lab.css">
	

	<!-- Link to javascript file - DEFER waits until all elements are rendered -->
	<script type="text/javascript" src="./js/lab.js" DEFER></script>
</head>
<body>
	<!-- Style this page by changing the CSS in ../css/site.css or css/lab.css -->
	<main id="content">
		<section>
			<h1 class="text-ctr">Network & Communications</h1>
			
			<div class="column-container">
			<!-- Column 1: Directory Hub -->
				<div class="minor-section">
						<!-- Interactive External Connection Anchor -->
					<div style="margin-bottom: 20px; margin-top: 15px;" class="text-ctr">
					<!-- Added pointer-events: none to the link wrapper so clicking it does nothing by default -->
						<a href="https://instagram.com/fantomsketches_/" target="_blank" rel="noopener noreferrer" style="text-decoration: none; pointer-events: none; display: inline-block;">
							<!-- Added pointer-events: auto so ONLY the image overrides the parent and triggers the click -->
							<img class="ig-logo" src="../lab1/img/Instagram_icon.png" alt="Instagram Profile Connection Feed" style="pointer-events: auto;">							
							<br>
							<!-- This remains unclickable, sits inside the link, and glitches perfectly on its own -->
							<span class="link-fidget" style="font-size: 22px; font-family: 'VT323', monospace; display: inline-block;">
								[ @fantomsketches_ ]
							</span>
						</a>
					</div>

				<div class="link-section">
					<h3 class="text-ctr" style="font-size: 30px; margin-top: 0; margin-bottom: 10px;">System Directory</h3>
					<nav id="links">
						<ul>
							<li><a href="../index.html" class="link-fidget">[ Return to Main Page ]</a></li>
						</ul>
					</nav>
				</div>
				</div>

			<!-- Column 2: Instagram Feed & Platform Specs -->
				<div class="minor-section">
					<!-- Feed Metadata Details -->
					<!-- The JS engine targets this ID, applies your layout indentation, and unredacts the content -->
  					<p id="typewriter-p" class="flashing-cursor-js"></p>
        		</div>
      		</div>
    	</section>
  	</main>
</body>
</html>
